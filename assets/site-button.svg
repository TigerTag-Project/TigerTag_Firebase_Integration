<svg xmlns="http://www.w3.org/2000/svg" width="480" height="104" viewBox="0 0 480 104" role="img" aria-label="Visit the integration guide">
  <title>Visit the integration guide</title>
  <defs>
    <linearGradient id="tsFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a2b"/>
      <stop offset="0.55" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#e6352b"/>
    </linearGradient>
    <linearGradient id="tsGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="476" height="100" rx="50" fill="url(#tsFill)"/>
  <rect x="2" y="2" width="476" height="50" rx="50" fill="url(#tsGloss)"/>
  <rect x="2.5" y="2.5" width="475" height="99" rx="49.5" fill="none" stroke="#ffffff" stroke-opacity="0.30"/>

  <!-- Two blocks joined by a link: a client plugged into the account. -->
  <g transform="translate(44 32)" fill="none" stroke="#ffffff" stroke-width="3.2"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.6" y="1.6" width="15" height="15" rx="4"/>
    <rect x="23.4" y="23.4" width="15" height="15" rx="4"/>
    <path d="M16.6 9.1h6.4a7.9 7.9 0 0 1 7.9 7.9v6.4"/>
    <path d="M9.1 16.6v6.4a7.9 7.9 0 0 0 7.9 7.9h6.4" stroke-opacity="0.55"/>
  </g>

  <text x="106" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Visit the integration guide</text>
  <text x="106" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="14.5" font-weight="500" fill="#ffffff" fill-opacity="0.88">Home Assistant, ESP32, Python, Spoolman</text>

  <path d="M434 40 l12 12 l-12 12" fill="none" stroke="#ffffff" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
</svg>
